name: Build hub & deploy to GitHub Pages

# 1) 매주 지정 시각에 노션 DB에서 최신 문헌을 가져와 파이프라인을 재실행하고
# 2) pipeline/templates 변경 시에도 재실행하여
# 3) docs/index.html을 GitHub Pages로 배포합니다.

on:
  schedule:
    - cron: "0 22 * * 0"  # 매주 일요일 22:00 UTC = 월요일 07:00 KST
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "templates/**"
      - "data/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (fetch_notion -> transform -> build_hub -> render_hub)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python pipeline/run_all.py

      - name: Commit rebuilt data & docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          git diff --staged --quiet || git commit -m "chore: weekly hub rebuild [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
